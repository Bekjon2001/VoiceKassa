<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f1e9" />
  <title>VoiceKassa | Stol tanlash</title>
  <script>
    // Kun/Tun (light/dark) rejimini sahifa chizilishidan OLDIN qo'llaymiz — miltillash bo'lmasligi uchun.
    try { document.documentElement.dataset.theme = localStorage.getItem("vk_theme") === "dark" ? "dark" : "light"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="menu-topbar">
    <a class="menu-back-link" href="index.html">← Restoranni almashtirish</a>
    <button class="theme-toggle" id="theme-toggle" type="button" title="Kun/Tun rejimini almashtirish" aria-label="Kun/Tun rejimini almashtirish">🌙</button>
  </header>
  <main class="shell tables-page">
    <section class="intro-panel">
      <div class="brand-mark" aria-label="VoiceKassa">VK</div>
      <p class="eyebrow">VOICEKASSA / STOL</p>
      <h1>Stolni<br /><em>tanlang.</em></h1>
      <p class="intro-copy">Bo'sh stolni tanlab, keyin menyudan taom tanlang.</p>
    </section>

    <section class="entry-panel" aria-labelledby="restaurant-title">
      <div class="panel-heading">
        <span class="step-label">02 / STOL</span>
        <h2 id="restaurant-title">Restoran</h2>
        <p>Stolingizni tanlang.</p>
      </div>

      <form id="entry-form" novalidate>
        <section class="table-section" id="table-section" aria-labelledby="table-title">
          <h3 id="table-title">Stolni tanlang</h3>
          <div class="table-list" id="table-list"></div>
        </section>

        <p class="location-note" id="location-note">Stollar ro‘yxati yuklanmoqda...</p>

        <input id="business-id" name="businessId" type="hidden" />
        <p class="form-message" id="form-message" role="status"></p>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
